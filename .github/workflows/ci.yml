name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project CaseNotes.xcodeproj \
            -scheme CaseNotes \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:CaseNotesTests \
            CODE_SIGNING_ALLOWED=NO
