name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          set -euo pipefail

          echo "== Runtimes =="
          xcrun simctl list runtimes

          echo "== Device Types =="
          xcrun simctl list devicetypes

          RUNTIME_ID=$(xcrun simctl list runtimes \
            | awk '/^iOS / && !/unavailable/ {print $NF}' \
            | tail -1)

          if [ -z "$RUNTIME_ID" ]; then
            echo "No available iOS Simulator runtime found."
            exit 1
          fi

          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-17"
          DEVICE_NAME="CaseNotes CI"

          echo "Using runtime: $RUNTIME_ID"
          echo "Using device type: $DEVICE_TYPE"

          DEVICE_ID=$(xcrun simctl create \
            "$DEVICE_NAME" \
            "$DEVICE_TYPE" \
            "$RUNTIME_ID")

          trap 'xcrun simctl delete "$DEVICE_ID" || true' EXIT

          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

          xcodebuild test \
            -project CaseNotes.xcodeproj \
            -scheme CaseNotes \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:CaseNotesTests \
            CODE_SIGNING_ALLOWED=NO
